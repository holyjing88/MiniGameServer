# MiniGameServer one-box stack: MySQL + RankServer.
# Usage (from repo root):
#   ./deployments/linux/deploy.sh
# Or:
#   docker compose -f deployments/docker-compose.yml --env-file deployments/linux/.env up -d --build

name: minigameserver

services:
  mysql:
    image: mysql:8.0
    container_name: mgs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-jgyjgyjgy}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-minigameserver}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mgs_mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  minigameserver:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    image: minigameserver:local
    container_name: mgs-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      RANK_HTTP_ADDR: ":8000"
      RANK_GRPC_ADDR: ":8001"
      RANK_STORE: mysql
      RANK_MYSQL_DSN: "root:${MYSQL_ROOT_PASSWORD:-jgyjgyjgy}@tcp(mysql:3306)/${MYSQL_DATABASE:-minigameserver}?parseTime=true&loc=UTC&charset=utf8mb4"
      RANK_SESSION_SECRET: "${RANK_SESSION_SECRET:-dev-session-secret-change-me}"
      RANK_SESSION_TTL_SEC: "${RANK_SESSION_TTL_SEC:-86400}"
      RANK_SERVICE_TOKEN: "${RANK_SERVICE_TOKEN:-dev-service-token}"
      RANK_TOPN_DEFAULT: "${RANK_TOPN_DEFAULT:-100}"
      RANK_TOPN_MAX: "${RANK_TOPN_MAX:-100}"
      RANK_REFRESH_SEC: "${RANK_REFRESH_SEC:-30}"
      RANK_TZ: "${RANK_TZ:-UTC}"
      RANK_AUTH_MODE: "${RANK_AUTH_MODE:-mock,tiktok}"
      RANK_AUTH_CHANNEL_MAP: "${RANK_AUTH_CHANNEL_MAP:-tiktok_minis:tiktok,douyin:tiktok,weixin:mock}"
      RANK_TT_APP_ID: "${RANK_TT_APP_ID:-7657847833046812688}"
      RANK_TT_CLIENT_KEY: "${RANK_TT_CLIENT_KEY:-mg79au52hgl5ggpi}"
      RANK_TT_CLIENT_SECRET: "${RANK_TT_CLIENT_SECRET:-QZAxJCXzGhbK2RWwt3IpXBHN90yNoKto}"
      RANK_DEFAULT_APP_ID: "${RANK_DEFAULT_APP_ID:-parking_smart_brain}"
    ports:
      - "${HTTP_PORT:-8000}:8000"
      - "${GRPC_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  mgs_mysql_data:
